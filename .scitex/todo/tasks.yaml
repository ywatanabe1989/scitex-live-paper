tasks:
  - id: live-paper-reusable-viewer-engine
    title: live-paper-reusable-viewer-engine — single reusable PDF/live-paper viewer for writer/scholar/hub
    status: done
    priority: 2
    note: |
      OWNER: proj-scitex-live-paper

      Operator-directed (TG 2026-06-13): make scitex-live-paper the SINGLE
      reusable PDF / live-paper viewer engine consumed by scitex-writer,
      scitex-scholar, and scitex-hub (project view, GitHub-PDF-viewer style).
      Must flex preprint vs accepted via a `PaperState` dataclass. Goal: NO
      duplicate PDF viewers anywhere; everyone delegates to ours.

      5-PR sequence (PR-per-card, no-mocks, CI-green self-merge): COMPLETE.
        [done] (1) PR #23 — Public API + BundleSource/BundleContext/PaperState/RendererOptions dataclasses.
        [done] (3) PR #24 — embed_mode SPA-shell variant (?embed=1, data-embed-mode="1") for iframe hosts.
        [done] (5) PR #25 — state.yaml bundle convention + auto-discovery (defaults to preprint).
        [done] (4) PR #26 — paper_state wired into landing page + bundle-info API.
        [done] (2) PR #27 — mount(resolver=...) + per-request BundleContext middleware (multi-tenant).

      Hub-side coordination COMPLETE: proj-scitex-hub PR #265 wires the
      `apps/workspace/live_paper_app/` wrapper against `_django.urls` +
      ?embed=1 + the public dataclasses. Their multi-tenant resolver flip
      lands as a follow-up against PR #27's mount() API.

      Reusable-component engine done. Next workstream: live-paper-absorb-writer-pdf-viewer-*
      (dogfood the proven scitex-writer PDF viewer into live-paper).
    comments:
