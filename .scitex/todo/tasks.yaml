        [pending]   (3) embed_mode SPA-shell variant — strips chrome for iframe/component embedding.
        [pending]   (4) Wire paper_state into renderers — header label + verification-badge visibility (claims/DAG semantics unchanged).
        [pending]   (5) state.yaml bundle convention + auto-discovery (default `preprint`).

      Out of scope until operator sequences it: scitex-writer's existing
      `_django/handlers/viewer.py` will eventually delegate to this engine
      (writer-side migration is design-only here; cross-repo step later).

      Coordination: hub-mount contract is being co-designed with
      proj-scitex-hub (PR #257 wrapper for `apps/workspace/live_paper_app/`,
      `apps/live-paper/` URL include). The BundleContext / mount(resolver)
      shape ships in PR (1) so hub's wrapper can target it on first try.
