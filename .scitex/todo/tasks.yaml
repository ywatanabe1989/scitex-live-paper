  # ──────────────────────────────────────────────────────────────────
  # NEW workstream (operator directive 2026-06-13 evening):
  # dogfood scitex-writer's working PDF viewer into live-paper.
  # See docs/research/writer-pdf-viewer-findings.md for the discovery.
  # ──────────────────────────────────────────────────────────────────

  - id: live-paper-absorb-writer-pdf-viewer-a-docs
    title: live-paper-absorb-writer-pdf-viewer (a) — document writer's PDF viewer + scitex.ai deployment
    status: done
    priority: 2
    note: |
      OWNER: proj-scitex-live-paper

      Document the existing scitex-writer PDF viewer (the one running well
      on scitex.ai) so the live-paper port has a single authoritative
      reference. Cover: where it lives, how it renders (PDF.js + canvas
      per page), the backend `/api/pdf` route, the Vite frontend build,
      what features it has, what features it explicitly LACKS (no
      text-layer, no annotation-layer, no find — per pdf-viewer.ts's
      own docstring), the deployment trail to scitex.ai, and the gap vs
      live-paper's current viewer.

      Output: `docs/research/writer-pdf-viewer-findings.md` (filed in this
      PR alongside the ticket).

      Blocks: (b) port, (c) features, (d) adopt. They all read this doc.

      Done when:
      - `docs/research/writer-pdf-viewer-findings.md` lands on develop.
      - Doc cross-references the three sibling tickets by id.
    comments:
      - author: proj-scitex-live-paper
        ts: '2026-06-13T22:30:00Z'
        text: |
          Filed + completed in the same PR as the discovery document
          (docs/writer-pdf-viewer-investigation). Findings: writer uses
          pdfjs-dist + a 112-line PDFViewer class (fit-width, zoom,
          per-page canvas column), `handle_pdf` serves PDF bytes via
          FileResponse, Vite bundles JS into static/writer/assets/.
          Live-paper currently has vendored PDF.js assets but NO renderer
          class — clean port target.

  - id: live-paper-absorb-writer-pdf-viewer-b-port
    title: live-paper-absorb-writer-pdf-viewer (b) — port pdf-viewer.ts + handle_pdf into live-paper
    status: pending
    priority: 2
    note: |
      OWNER: proj-scitex-live-paper

      Port the working bits of scitex-writer's PDF viewer into
      scitex-live-paper. Scope (per the (a) findings doc):

      Frontend:
      - Copy `scitex_writer/_django/frontend/src/pdf-viewer.ts` →
        `scitex_live_paper/_django/frontend/src/pdf-viewer.ts`.
      - Copy `scitex_writer/_django/frontend/src/pdf-theme.ts` →
        `scitex_live_paper/_django/frontend/src/pdf-theme.ts`.
      - New `scitex_live_paper/_django/frontend/src/viewer.ts`: adapt
        writer's bootstrap to live-paper's existing root selector
        (`#live-paper-root`), data-attrs (`data-api-base`,
        `data-embed-mode`), and `RendererOptions` (theme).
      - New `scitex_live_paper/_django/frontend/src/api.ts`: read
        `API_BASE` from the root element's `data-api-base` attribute
        (live-paper's existing convention) — NOT writer's PROJECT_DIR
        which is project-pathed.
      - Add `frontend/package.json`, `vite.config.ts`, `tsconfig.json`
        mirroring writer's setup. Build artefacts go to
        `_django/static/live_paper/assets/`.

      Backend:
      - Add `_django/handlers/pdf.py` with `handle_pdf` returning
        `FileResponse(bundle.manuscript_path, content_type="application/pdf")`.
      - Register `"api/pdf": handle_pdf` in `_django/handlers/__init__.py`.
      - Generalize the `doc_type` map: bundle layout has flat
        `manuscript.pdf` today; supplementary/revision are writer-only
        for now (skip until bundle layout extends).

      Wire-up:
      - `_django/templates/live_paper/viewer.html` + `viewer_embed.html`
        include the built `static/live_paper/assets/viewer.js` bundle
        (replaces the current stub `static/live_paper/js/viewer.js`).
      - Update the SPA boot stub to read `data-api-base` (already does)
        and call the new PDF viewer class.

      Tests (no-mocks per ecosystem doctrine):
      - Real-subprocess test: `python -m scitex_live_paper._cli render
        tests/fixtures/bundle-min --out /tmp/site` continues to emit a
        working static site that opens from file:// (the Django-mount path
        is server-side; static-site path uses the existing vendored
        PDF.js assets unchanged).
      - Django test client: GET `/api/pdf` returns 200 + content-type
        `application/pdf` + the bundle's manuscript bytes.
      - GET `/api/pdf?download=1` flips to `Content-Disposition: attachment`.
      - Viewer page references the built `assets/viewer.js` bundle.

      Done when:
      - `pip install -e .[django]` builds successfully (Vite build is a
        prerequisite — may need a Makefile target or pre-built artefacts
        shipped in the package).
      - `scitex-live-paper serve tests/fixtures/bundle-accepted` opens
        a real PDF.js render of `manuscript.pdf` with fit-width + zoom
        controls working (manual verification).
      - All existing tests still pass; new tests above pass.

      Blocks: (d) adopt. (c) features can start in parallel once (b) is in.
      Cross-ref: (a) docs for the architecture rationale.

  - id: live-paper-absorb-writer-pdf-viewer-c-features
    title: live-paper-absorb-writer-pdf-viewer (c) — add text-layer + annotation-layer + find
    status: pending
    priority: 3
    note: |
      OWNER: proj-scitex-live-paper

      The writer viewer's pdf-viewer.ts explicitly defers these features
      ("Minimal: no text-layer, no annotation-layer, no find. PR5/6 can
      add them.") — since live-paper is now the canonical viewer, add them
      HERE so when writer/scholar/hub adopt (ticket d), they inherit the
      upgrades.

      Scope (PDF.js stock surfaces):
      - **Text layer** — `page.getTextContent()` + `TextLayer` so users
        can select and copy text from the PDF.
      - **Annotation layer** — `page.getAnnotations()` + `AnnotationLayer`
        so PDF-internal links (refs, hyperlinks, form fields) work.
      - **Find / search** — bind Ctrl-F to a PDF.js `EventBus` find
        controller; render highlight matches across pages.

      Out of scope:
      - Custom annotation creation (highlights, sticky notes) — that's a
        separate write-back surface.
      - Print preview — defer until requested.

      Done when:
      - Live-paper viewer supports text selection (manual verification).
      - PDF-internal links navigate (manual verification).
      - Ctrl-F surfaces a search box and matches highlight in-canvas.
      - Tests verify the text-layer + annotation-layer elements are
        present in the rendered DOM for a fixture PDF.

      Blocks: nothing (this is the upgrade that makes live-paper exceed
      writer's current viewer).
      Cross-ref: (a) docs (writer's deferral note), (b) port (the base
      this builds on).

  - id: live-paper-absorb-writer-pdf-viewer-d-adopt
    title: live-paper-absorb-writer-pdf-viewer (d) — wire writer + scholar + hub to consume live-paper's viewer
    status: blocked
    priority: 2
    note: |
      OWNER: proj-scitex-live-paper (live-paper-side wiring) +
             proj-scitex-hub (hub-side, in flight via PR #265 + follow-ups) +
             proj-scitex-writer (NOT YET ASSIGNED — request the lead spawn one)

      Drive adoption: every host app that today renders its own PDF viewer
      starts consuming live-paper's instead. Goal: zero duplicate PDF
      viewers in the SciTeX ecosystem.

      Subtasks:

      1. **hub** — proj-scitex-hub PR #265 already wires
         `apps/workspace/live_paper_app/` against live-paper's `_django.urls`
         + ?embed=1. Their follow-up PR flips to `mount(resolver=...)` for
         multi-tenant. No live-paper-side work needed; hub owns.

      2. **writer** — drop `scitex_writer/_django/frontend/src/pdf-viewer.ts`
         and `pdf-theme.ts` and `viewer.ts`. Replace the writer viewer page
         with either:
         - (preferred) `include(scitex_live_paper.mount(resolver=writer_resolver))`
           under writer's `/viewer/` URL, with writer's resolver building a
           `BundleContext(source=BundleSource.from_bundle(editor.bundle),
                          paper_state=PaperState(stage="draft"),
                          api_base=..., options=RendererOptions(embed_mode=True))`,
           OR
         - (fallback) iframe pointing at hub's `apps/live-paper/<paper_id>/?embed=1`.
         Writer keeps its authoring handlers (compile / save / switch);
         only the viewer surface is delegated.

      3. **scholar** — same `mount(resolver=...)` pattern under
         `/scholar/<paper_id>/`. Resolver builds BundleContext from
         scholar's per-paper lookup. PaperState.stage comes from review
         workflow.

      Done when:
      - Writer viewer mode renders via live-paper (no `writer/assets/pdf-viewer.js`
        shipped); writer-side branch lands with live-paper as a dep.
      - Scholar paper page renders via live-paper.
      - Hub's project-view iframe targets `apps/live-paper/<paper_id>/?embed=1`
        with multi-tenant resolver active.

      Blocked on:
      - (b) port — live-paper must have the working viewer for hosts to
        delegate to.
      - Cross-repo writer/scholar work — needs writer-side and
        scholar-side agents. Lead, please spawn proj-scitex-writer when
        ticket (b) is in flight so the writer-side migration can start
        in parallel.

      Cross-ref: (a) docs, (b) port, (c) features.
